let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

const startScreen = document.getElementById('start-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results-screen');

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function generateOptions(q) {
    const options = shuffle([q.a, ...q.d]);
    return options;
}

function showScreen(screen) {
    [startScreen, quizScreen, resultsScreen].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
}

function startQuiz(sectionIndex) {
    if (sectionIndex === 'all') {
        let all = [];
        quizData.forEach(s => {
            s.questions.forEach(q => all.push({...q, section: s.section}));
        });
        currentQuestions = shuffle(all).slice(0, 30);
    } else {
        const sec = quizData[sectionIndex];
        currentQuestions = shuffle(sec.questions.map(q => ({...q, section: sec.section})));
    }
    currentIndex = 0;
    score = 0;
    answered = false;
    showScreen(quizScreen);
    renderQuestion();
}

function renderQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];
    document.getElementById('q-current').textContent = currentIndex + 1;
    document.getElementById('q-total').textContent = currentQuestions.length;
    document.getElementById('q-score').textContent = score;
    document.getElementById('q-section').textContent = q.section;
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('progress').style.width = ((currentIndex) / currentQuestions.length * 100) + '%';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-skip').style.display = '';

    const optionsEl = document.getElementById('q-options');
    optionsEl.innerHTML = '';
    const options = generateOptions(q);
    options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.addEventListener('click', () => selectAnswer(div, opt, q.a));
        optionsEl.appendChild(div);
    });
}

function selectAnswer(el, selected, correct) {
    if (answered) return;
    answered = true;
    const options = document.querySelectorAll('.option');
    options.forEach(o => {
        o.classList.add('disabled');
        if (o.textContent === correct) o.classList.add('correct');
    });
    if (selected !== correct) {
        el.classList.add('wrong');
    } else {
        score++;
        document.getElementById('q-score').textContent = score;
    }
    document.getElementById('btn-skip').style.display = 'none';
    document.getElementById('btn-next').style.display = '';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= currentQuestions.length) {
        showResults();
    } else {
        renderQuestion();
    }
}

function showResults() {
    showScreen(resultsScreen);
    const pct = Math.round((score / currentQuestions.length) * 100);
    const circle = document.getElementById('score-circle');
    circle.textContent = pct + '%';
    circle.className = 'score-circle ' + (pct >= 80 ? 'great' : pct >= 50 ? 'good' : 'poor');
    document.getElementById('result-text').textContent = score + ' out of ' + currentQuestions.length + ' correct';
    const msg = pct >= 90 ? '🎉 Excellent! You\'re well prepared!' :
                pct >= 70 ? '👍 Good job! Review a few topics and you\'ll ace it.' :
                pct >= 50 ? '📖 Not bad, but more practice would help.' :
                '💪 Keep studying! You\'ll get there.';
    document.getElementById('result-detail').textContent = msg;
    document.getElementById('progress').style.width = '100%';
}

// Event listeners
document.querySelectorAll('.section-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const sec = btn.dataset.section;
        startQuiz(sec === 'all' ? 'all' : parseInt(sec));
    });
});

document.getElementById('btn-next').addEventListener('click', nextQuestion);
document.getElementById('btn-skip').addEventListener('click', () => {
    if (!answered) {
        answered = true;
        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }
});
document.getElementById('btn-retry').addEventListener('click', () => {
    const sec = currentQuestions[0] ? currentQuestions[0].section : null;
    let idx = 'all';
    quizData.forEach((s, i) => { if (s.section === sec) idx = i; });
    startQuiz(idx);
});
document.getElementById('btn-home').addEventListener('click', () => showScreen(startScreen));
</script>
